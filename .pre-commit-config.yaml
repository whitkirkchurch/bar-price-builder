exclude: "migrations/"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown, css]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-pytz
          - types-requests

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-jsonschema
        files: ^data/ignore.yaml$
        args: ["--schemafile", "data/schema/ignore.schema.json"]
      - id: check-jsonschema
        files: ^data/prices.yaml$
        args: ["--schemafile", "data/schema/prices.schema.json"]

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.40.9
    hooks:
      - id: djlint-reformat-jinja
      - id: djlint-jinja

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
      - id: terraform_providers_lock
        args:
          - --hook-config=--mode=check-lockfile-is-cross-platform
          - --args=-platform=linux_amd64
          - --args=-platform=darwin_arm64
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-lockfile=readonly
      - id: terraform_tflint
